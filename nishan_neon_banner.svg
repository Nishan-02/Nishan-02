<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="1"></stop>
      <stop offset="100%" stop-color="#001122" stop-opacity="0.5"></stop>
    </radialGradient>

    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#00F7FF"></stop>
      <stop offset="100%" stop-color="#007BFF"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="#00060F"></rect>

  <!-- Neon Glow -->
  <ellipse cx="600" cy="150" rx="540" ry="140" fill="url(#neonGlow)" filter="drop-shadow(0px 0px 40px #00F7FF)"></ellipse>

  <!-- Text -->
  <text x="50%" y="52%" text-anchor="middle" style="font-family:'Monument Extended', sans-serif;
    font-size:50px;
    font-weight:900;
    fill:url(#neonText);
    filter: drop-shadow(0px 0px 18px #00F7FF);
    letter-spacing:6px;">
    N I S H A N • FULL STACK &amp; ML ENGINEER
  </text>
</svg>
